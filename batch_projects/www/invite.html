{% extends "templates/web.html" %}

{% block page_content %}
<div class="py-8" style="max-width: 520px; margin: 0 auto;">
  <h2>{{ _("Project invitation") }}</h2>
  {% if error %}
    <div class="alert alert-warning mt-4" role="alert">{{ error }}</div>
    <p class="text-muted mt-3">
      {{ _("Ask whoever invited you to send a fresh invitation.") }}
    </p>
  {% else %}
    <p class="mt-4">{{ _("Accepting your invitation…") }}</p>
  {% endif %}
</div>
{% endblock %}
